services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quote_invoice_builder
    ports:
      - "5432:5432"
    volumes:
      - quote_invoice_builder_pgdata:/var/lib/postgresql/data

volumes:
  quote_invoice_builder_pgdata:
