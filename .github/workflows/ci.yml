name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web

# Integration/E2E stages are intentionally absent — see
# docs/Architecture Decisions.md ADR-6. This pipeline covers what
# docs/Code & Development Workflow.md section 60 calls the minimum:
# install -> lint -> type check -> unit tests -> build.
env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
  AUTH_SECRET: "ci-placeholder-secret-not-for-real-use"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
